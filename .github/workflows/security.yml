name: security
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "17 3 * * 1" }]   # weekly: new advisories appear without code changes
  workflow_dispatch:
permissions: {}
concurrency: { group: "security-${{ github.ref }}", cancel-in-progress: true }
env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: gitleaks (pinned binary, sha256 verified, full history)
        run: |
          curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --no-banner --config .gitleaks.toml --redact --exit-code 1 .
  sast:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install bandit==1.9.4 semgrep==1.185.0
      - name: bandit (medium+ severity, product code; tests excluded)
        run: bandit -r bin scripts mcp -ll -q
      - name: semgrep (in-repo rules only, no registry, metrics off)
        run: semgrep --metrics=off --config .semgrep/netpaw.yml --error --quiet bin scripts mcp tests
  deps:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit==2.10.1
      - name: pip-audit on hash-locked requirements (fails on any known vuln)
        run: pip-audit -r mcp/fwrule/requirements.txt --disable-pip --require-hashes
      - name: pip-audit on the client/server pin used by subnet-calc
        run: |
          echo "mcp==1.30.0" > /tmp/mcp-pin.txt
          pip-audit -r /tmp/mcp-pin.txt --no-deps --disable-pip
  workflows:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install zizmor==1.32.0
      - run: zizmor --offline --min-severity medium .github
  policy:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: repo policy (write-skill gate, symlinks, allow-list, secrets, doc IPs)
        run: python3 scripts/lint.py
      - name: upstream pin / tool-list drift (live; fails if fwrule tool list != reviewed cache)
        run: uv run --quiet --no-project --isolated --with "mcp==1.30.0" python scripts/gen_tools_cache.py fwrule --check
  sbom:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install cyclonedx-bom==8.0.1
      - run: cyclonedx-py requirements mcp/fwrule/requirements.txt --of JSON -o sbom-fwrule.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: sbom, path: sbom-fwrule.cdx.json, retention-days: 90 }
